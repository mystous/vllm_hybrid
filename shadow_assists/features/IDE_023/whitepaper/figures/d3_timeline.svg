<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="Noto Sans KR"><rect width="900" height="410" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs><text x="450" y="30" font-size="19" fill="#111" text-anchor="middle" font-weight="700" font-style="normal">그림 3. 하이브리드 디코드 스텝의 시간 구성</text><text x="450" y="52" font-size="13" fill="#546e7a" text-anchor="middle" font-weight="400" font-style="normal">실측 TPOT p50 = 305.5 ms · GPU util 평균 75.6% · CPU busy 평균 42.7%</text><text x="40" y="134" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="700" font-style="normal">GPU</text><text x="40" y="214" font-size="15" fill="#1565c0" text-anchor="start" font-weight="700" font-style="normal">CPU</text><line x1="95" y1="96" x2="860" y2="96" stroke="#cfd8dc"/><rect x="100" y="110" width="120" height="46" rx="5" fill="#2e7d32" stroke="#37474f" stroke-width="1.4"/><text x="160.0" y="133.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">MLA attn</text><rect x="230" y="110" width="96" height="46" rx="5" fill="#2e7d32" stroke="#37474f" stroke-width="1.4"/><text x="278.0" y="133.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">router</text><rect x="470" y="110" width="110" height="46" rx="5" fill="#2e7d32" stroke="#37474f" stroke-width="1.4"/><text x="525.0" y="133.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">combine</text><rect x="590" y="110" width="120" height="46" rx="5" fill="#2e7d32" stroke="#37474f" stroke-width="1.4"/><text x="650.0" y="133.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">MLA attn</text><rect x="720" y="110" width="96" height="46" rx="5" fill="#2e7d32" stroke="#37474f" stroke-width="1.4"/><text x="768.0" y="133.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">router</text><rect x="330" y="190" width="135" height="46" rx="5" fill="#1565c0" stroke="#37474f" stroke-width="1.4"/><text x="397.5" y="213.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">expert FFN</text><rect x="790" y="190" width="70" height="46" rx="5" fill="#1565c0" stroke="#37474f" stroke-width="1.4"/><text x="825.0" y="213.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">expert</text><path d="M326,156 L340,190" stroke="#ef6c00" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M465,190 L478,156" stroke="#ef6c00" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="300" y="266" font-size="11" fill="#ef6c00" text-anchor="middle" font-weight="400" font-style="normal">hidden 전송</text><text x="495" y="266" font-size="11" fill="#ef6c00" text-anchor="middle" font-weight="400" font-style="normal">출력 반환</text><rect x="326" y="110" width="144" height="46" rx="5" fill="#eceff1" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="5 4"/><text x="398" y="136" font-size="12" fill="#607d8b" text-anchor="middle" font-weight="600" font-style="normal">GPU 대기</text><line x1="100" y1="290" x2="590" y2="290" stroke="#37474f" stroke-width="1.4"/><line x1="100" y1="284" x2="100" y2="296" stroke="#37474f" stroke-width="1.4"/><line x1="590" y1="284" x2="590" y2="296" stroke="#37474f" stroke-width="1.4"/><text x="345" y="312" font-size="13" fill="#37474f" text-anchor="middle" font-weight="600" font-style="normal">1 토큰 = TPOT 305.5 ms (실측 p50)</text><text x="40" y="352" font-size="12" fill="#263238" text-anchor="start" font-weight="400" font-style="normal">· CPU expert 구간이 이 스텝의 지배 항이다. cpuinfer 96 스레드가 포화하며 CPU busy 42.7% (112C/224T 기준) 를 만든다.</text><text x="40" y="372" font-size="12" fill="#263238" text-anchor="start" font-weight="400" font-style="normal">· 이 경로는 CPU 동기 실행이라 CUDA graph replay 와 호환되지 않아 --disable-cuda-graph 가 필수였다 (우회 4건 중 결정타).</text><text x="40" y="392" font-size="12" fill="#c62828" text-anchor="start" font-weight="400" font-style="normal">· 그림의 구간 폭은 개념적 비율이다. 구간별 개별 계측은 이 캠페인에서 수행하지 않았다 (총 TPOT 만 실측).</text></svg>