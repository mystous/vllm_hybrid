<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="Noto Sans KR"><rect width="880" height="580" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs><text x="430" y="30" font-size="19" fill="#111" text-anchor="middle" font-weight="700" font-style="normal">그림 1. MoE 층의 연산 구조와 오프로딩 경계</text><text x="430" y="52" font-size="13" fill="#546e7a" text-anchor="middle" font-weight="400" font-style="normal">GPU 는 attention·router·combine 을, CPU 는 expert FFN 을 맡는다</text><rect x="30" y="80" width="380" height="410" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="50" y="106" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="700" font-style="normal">GPU (H100 ×8, TP=8)</text><text x="50" y="126" font-size="12" fill="#558b2f" text-anchor="start" font-weight="400" font-style="normal">HBM 상주: attention 가중치 + KV cache</text><rect x="70" y="142" width="300" height="52" rx="8" fill="#2e7d32" stroke="#37474f" stroke-width="1.4"/><text x="220.0" y="161.0" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">입력 hidden state</text><text x="220.0" y="179.0" font-size="12" fill="#ffffff" opacity="0.9" text-anchor="middle" dominant-baseline="middle">토큰 × d_model</text><path d="M220,194 L220,214" stroke="#37474f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="70" y="214" width="300" height="58" rx="8" fill="#2e7d32" stroke="#37474f" stroke-width="1.4"/><text x="220.0" y="236.0" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">MLA Attention</text><text x="220.0" y="254.0" font-size="12" fill="#ffffff" opacity="0.9" text-anchor="middle" dominant-baseline="middle">Multi-head Latent Attention · KV cache 접근</text><path d="M220,272 L220,292" stroke="#37474f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="70" y="292" width="300" height="58" rx="8" fill="#2e7d32" stroke="#37474f" stroke-width="1.4"/><text x="220.0" y="314.0" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Router (gate)</text><text x="220.0" y="332.0" font-size="12" fill="#ffffff" opacity="0.9" text-anchor="middle" dominant-baseline="middle">top-k expert 선택 · 토큰별 8/257</text><rect x="70" y="400" width="300" height="58" rx="8" fill="#2e7d32" stroke="#37474f" stroke-width="1.4"/><text x="220.0" y="422.0" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Combine + 잔차</text><text x="220.0" y="440.0" font-size="12" fill="#ffffff" opacity="0.9" text-anchor="middle" dominant-baseline="middle">expert 출력 가중합 → 다음 층</text><rect x="470" y="80" width="380" height="410" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="490" y="106" font-size="15" fill="#1565c0" text-anchor="start" font-weight="700" font-style="normal">CPU (Xeon 8480+ ×2, AMX)</text><text x="490" y="126" font-size="12" fill="#1976d2" text-anchor="start" font-weight="400" font-style="normal">DRAM 상주: expert 가중치 전량 (AMXINT4)</text><rect x="500" y="150" width="320" height="44" rx="8" fill="#1565c0" stroke="#37474f" stroke-width="1.4"/><text x="660.0" y="165.0" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Expert 1</text><text x="660.0" y="183.0" font-size="10" fill="#ffffff" opacity="0.9" text-anchor="middle" dominant-baseline="middle">W1·W3 → SiLU → W2  (AMX INT4 GEMM)</text><rect x="500" y="206" width="320" height="44" rx="8" fill="#1565c0" stroke="#37474f" stroke-width="1.4"/><text x="660.0" y="221.0" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Expert 2</text><text x="660.0" y="239.0" font-size="10" fill="#ffffff" opacity="0.9" text-anchor="middle" dominant-baseline="middle">W1·W3 → SiLU → W2  (AMX INT4 GEMM)</text><rect x="500" y="262" width="320" height="44" rx="8" fill="#1565c0" stroke="#37474f" stroke-width="1.4"/><text x="660.0" y="284.0" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">…</text><rect x="500" y="318" width="320" height="44" rx="8" fill="#1565c0" stroke="#37474f" stroke-width="1.4"/><text x="660.0" y="333.0" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Expert 256</text><text x="660.0" y="351.0" font-size="10" fill="#ffffff" opacity="0.9" text-anchor="middle" dominant-baseline="middle">W1·W3 → SiLU → W2  (AMX INT4 GEMM)</text><rect x="500" y="374" width="320" height="44" rx="8" fill="#0d47a1" stroke="#37474f" stroke-width="1.4"/><text x="660.0" y="389.0" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Shared expert (257)</text><text x="660.0" y="407.0" font-size="10" fill="#ffffff" opacity="0.9" text-anchor="middle" dominant-baseline="middle">W1·W3 → SiLU → W2  (AMX INT4 GEMM)</text><path d="M370,321 L500,250" stroke="#ef6c00" stroke-width="2.2" fill="none" marker-end="url(#a)"/><text x="435" y="236" font-size="12" fill="#ef6c00" text-anchor="middle" font-weight="600" font-style="normal">선택된 expert</text><text x="435" y="252" font-size="11" fill="#ef6c00" text-anchor="middle" font-weight="400" font-style="normal">hidden 전송</text><path d="M500,396 L370,429" stroke="#ef6c00" stroke-width="2.2" fill="none" marker-end="url(#a)"/><text x="435" y="445" font-size="12" fill="#ef6c00" text-anchor="middle" font-weight="600" font-style="normal">expert 출력 반환</text><text x="30" y="520" font-size="13" fill="#263238" text-anchor="start" font-weight="400" font-style="normal">오프로딩 경계의 근거: expert FFN 은 토큰마다 top-k 개만 활성되는 희소 연산이라 층당 실제 계산량이 작고,</text><text x="30" y="540" font-size="13" fill="#263238" text-anchor="start" font-weight="400" font-style="normal">가중치는 전체 파라미터의 대부분을 차지한다. 즉 '용량은 크고 연산은 드문' 부분이므로 대용량 DRAM 쪽에 두는 것이 유리하다.</text><text x="30" y="560" font-size="13" fill="#263238" text-anchor="start" font-weight="400" font-style="normal">반대로 attention 은 KV cache 를 매 토큰 접근하는 대역폭 민감 연산이라 HBM 에 남긴다.</text></svg>